<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صوفيه لتسويق مواد الزينة</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600&family=Tajawal:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">

  <!-- الأيقونة والتطبيق -->
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B03A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SOFIA">

  <!-- معاينة الرابط في واتساب وغيره -->
  <meta name="description" content="صوفيه لتسويق مواد الزينة: مجففات ومصففات الشعر، مكائن الحلاقة وفرش الشعر.">
  <meta property="og:title" content="SOFIA | صوفيه لتسويق مواد الزينة">
  <meta property="og:description" content="تصفّح منتجاتنا وأسعارها واطلب مباشرة على الواتساب.">
  <meta property="og:image" content="https://bdalrhmnbnshbl94-source.github.io/sofia-beauty/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:secure_url" content="https://bdalrhmnbnshbl94-source.github.io/sofia-beauty/og-image.jpg">
  <meta itemprop="image" content="https://bdalrhmnbnshbl94-source.github.io/sofia-beauty/og-image.jpg">
  <meta property="og:url" content="https://bdalrhmnbnshbl94-source.github.io/sofia-beauty/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SOFIA">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <header>
    <div class="wrap brand"><b>صوفيه</b><span>لتسويق مواد الزينة</span></div>
  </header>

  <main class="wrap">
    <section class="hero">
      <img src="logo-sofia.svg" alt="SOFIA" class="hero-logo">
      <h1><em>صوفيه</em> لتسويق مواد الزينة</h1>
      <p>تصفّح منتجاتنا وأسعارها، واطلب مباشرة على الواتساب.</p>
      <div class="contact">واتساب: <b id="phone"></b> <a id="wa" class="wa-btn" target="_blank">راسلنا</a></div>
    </section>

    <!-- البحث والترتيب -->
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="🔍 ابحث عن منتج...">
      <select class="sort" id="sort">
        <option value="new">الترتيب: الأحدث</option>
        <option value="low">السعر: من الأرخص</option>
        <option value="high">السعر: من الأغلى</option>
      </select>
    </div>

    <div class="chips" id="chips"></div>
    <div class="chips sub" id="subchips" hidden></div>
    <section class="grid" id="grid"></section>
  </main>

  <footer>
    <div class="wrap">
      <div class="social" id="social"></div>
      صوفيه لتسويق مواد الزينة · الأسعار بالدينار الليبي
    </div>
  </footer>

  <!-- زر السلة -->
  <button class="cart-btn" id="cartBtn" hidden>🛒 السلة <span id="cartCount">0</span></button>

  <!-- نافذة السلة -->
  <dialog id="cart" class="cart">
    <div class="cart-in">
      <button class="close" data-close aria-label="إغلاق">×</button>
      <h2>🛒 سلة الطلب</h2>
      <div id="cartItems"></div>
      <div class="cart-total">المجموع: <b id="cartTotal">0</b> د.ل</div>
      <a class="order" id="sendOrder" target="_blank">أرسل الطلب على واتساب</a>
      <button class="clear" id="clearCart">إفراغ السلة</button>
    </div>
  </dialog>

  <!-- نافذة تفاصيل المنتج -->
  <dialog id="details">
    <button class="close" data-close aria-label="إغلاق">×</button>
    <div id="detailsBody"></div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <!-- المنتجات (دائماً آخر نسخة) -->
  <script>document.write('<script src="products.js?v=' + Date.now() + '"><\/script>');</script>
  <script>
    // ===== إعدادات احتياطية لو ناقصة في products.js =====
    if (typeof SUBCATEGORIES === "undefined") window.SUBCATEGORIES = {};
    if (typeof INSTAGRAM === "undefined") window.INSTAGRAM = "";
    if (typeof TIKTOK === "undefined") window.TIKTOK = "";

    let current = "الكل", currentSub = "الكل", searchText = "", sortBy = "new";
    const $ = id => document.getElementById(id);

    // كل منتج له رقم ثابت (id) وقائمة صور
    PRODUCTS.forEach((p, i) => {
      p.id = p.id || "i" + i;
      p.images = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
    });
    const byId = id => PRODUCTS.find(p => p.id === id);

    // ===== عدّاد الزوار =====
    function track(name) {
      if (window.goatcounter && goatcounter.count) goatcounter.count({ path: name, title: name, event: true });
    }

    // ===== واتساب =====
    let waNumber = PHONE.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^0-9]/g, "");
    if (waNumber.startsWith("00")) waNumber = waNumber.slice(2);
    if (waNumber.startsWith("2180")) waNumber = "218" + waNumber.slice(4);
    if (waNumber.startsWith("0")) waNumber = "218" + waNumber.slice(1);
    const waLink = text => "https://wa.me/" + waNumber + (text ? "?text=" + encodeURIComponent(text) : "");
    $("phone").textContent = PHONE;
    $("wa").href = waLink("");
    $("wa").onclick = () => track("واتساب-راسلنا");

    // ===== انستغرام وتيك توك =====
    let social = "";
    if (INSTAGRAM) social += `<a href="${INSTAGRAM}" target="_blank">انستغرام</a>`;
    if (TIKTOK) social += `<a href="${TIKTOK}" target="_blank">تيك توك</a>`;
    $("social").innerHTML = social;

    // ===== أجزاء صغيرة =====
    const img = (file, name) => `<img src="images/${file}" alt="${name}" loading="lazy"
        onerror="this.outerHTML='<span class=letter>${name[0]}</span>'">`;
    const firstPic = p => p.images.length ? img(p.images[0], p.name) : `<span class="letter">${p.name[0]}</span>`;
    function priceHTML(p) {
      let h = `<span class="price">${p.price} <small>د.ل</small></span>`;
      if (p.oldPrice > p.price) h += ` <s class="old">${p.oldPrice}</s>`;
      return h;
    }
    function badges(p) {
      let h = "";
      if (p.soldOut) h += `<span class="badge out">نفدت الكمية</span>`;
      else if (p.oldPrice > p.price) h += `<span class="badge sale">تخفيض</span>`;
      if (p.isNew) h += `<span class="badge new">جديد</span>`;
      if (p.images.length > 1) h += `<span class="badge pics">📸 ${p.images.length}</span>`;
      return `<div class="badges">${h}</div>`;
    }
    const catLabel = p => p.sub ? p.category + " · " + p.sub : p.category;
    function addButton(p) {
      if (p.soldOut) return `<span class="order disabled">غير متوفر حالياً</span>`;
      return `<button class="order add" data-add="${p.id}">🛒 أضف للسلة</button>`;
    }
    function toast(text) {
      const t = $("toast");
      t.textContent = text;
      t.hidden = false;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => t.hidden = true, 1800);
    }

    // ===== الأقسام =====
    function showChips() {
      $("chips").innerHTML = ["الكل", ...CATEGORIES].map(c =>
        `<button class="chip ${c === current ? "active" : ""}" data-cat="${c}">${c}${SUBCATEGORIES[c] ? " ▾" : ""}</button>`).join("");
      const subs = SUBCATEGORIES[current];
      $("subchips").hidden = !subs;
      $("subchips").innerHTML = subs ? ["الكل", ...subs].map(s =>
        `<button class="chip ${s === currentSub ? "active" : ""}" data-sub="${s}">${s}</button>`).join("") : "";
    }
    $("chips").onclick = e => {
      const b = e.target.closest(".chip"); if (!b) return;
      current = b.dataset.cat; currentSub = "الكل"; showChips(); showProducts();
    };
    $("subchips").onclick = e => {
      const b = e.target.closest(".chip"); if (!b) return;
      currentSub = b.dataset.sub; showChips(); showProducts();
    };

    // ===== المنتجات =====
    function showProducts() {
      let list = PRODUCTS.filter(p =>
        (current === "الكل" || p.category === current) &&
        (currentSub === "الكل" || p.sub === currentSub) &&
        p.name.includes(searchText));
      if (sortBy === "low") list.sort((a, b) => a.price - b.price);
      else if (sortBy === "high") list.sort((a, b) => b.price - a.price);
      else list = list.slice().reverse();

      if (!list.length) {
        $("grid").innerHTML = searchText
          ? `<p class="empty">ما فيه منتج بهذا الاسم 🙁</p>`
          : `<p class="empty">ما فيه منتجات في هذا القسم حالياً، قريباً إن شاء الله ✨</p>`;
        return;
      }
      $("grid").innerHTML = list.map(p => `
        <article class="card ${p.soldOut ? "is-out" : ""}" data-id="${p.id}">
          <div class="pic">${firstPic(p)}${badges(p)}</div>
          <div class="info">
            <div class="cat">${catLabel(p)}</div>
            <h3>${p.name}</h3>
            <div class="prices">${priceHTML(p)}</div>
            ${addButton(p)}
          </div>
        </article>`).join("");
    }

    // ===== تفاصيل المنتج (مع كل الصور وزر المشاركة) =====
    const details = $("details");
    function openProduct(p) {
      const pics = p.images.length ? p.images : [null];
      $("detailsBody").innerHTML = `
        <div class="d-pic">
          <div class="slider" id="slider">${pics.map(f => `<div class="slide">${f ? img(f, p.name) : `<span class="letter">${p.name[0]}</span>`}</div>`).join("")}</div>
          ${pics.length > 1 ? `<div class="dots" id="dots">${pics.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}
          ${badges(p)}
        </div>
        <div class="d-info">
          <div class="cat">${catLabel(p)}</div>
          <h2>${p.name}</h2>
          <p>${p.description || ""}</p>
          <div class="prices">${priceHTML(p)}</div>
          ${addButton(p)}
          ${p.soldOut ? "" : `<a class="order ghost" target="_blank" href="${waLink("مرحباً، أبي أطلب: " + p.name + " – " + p.price + " د.ل")}" onclick="track('طلب-مباشر/${p.name}')">اطلب الآن على واتساب</a>`}
          <button class="share" data-share="${p.id}">🔗 شارك المنتج</button>
        </div>`;
      const slider = $("slider"), dots = $("dots");
      if (dots) slider.onscroll = () => {
        const i = Math.round(Math.abs(slider.scrollLeft) / slider.clientWidth);
        [...dots.children].forEach((d, k) => d.className = k === i ? "on" : "");
      };
      history.replaceState(null, "", "#p-" + p.id);
      if (!details.open) details.showModal();
      track("منتج/" + p.name);
    }
    $("grid").onclick = e => {
      if (e.target.closest("[data-add]")) return;
      const c = e.target.closest(".card");
      if (c) openProduct(byId(c.dataset.id));
    };
    details.addEventListener("close", () => history.replaceState(null, "", location.pathname + location.search));

    // ===== المشاركة =====
    async function share(p) {
      const url = location.origin + location.pathname + "#p-" + p.id;
      const text = p.name + " – " + p.price + " د.ل";
      track("مشاركة/" + p.name);
      if (navigator.share) {
        try { await navigator.share({ title: "SOFIA", text, url }); } catch (e) {}
        return;
      }
      try { await navigator.clipboard.writeText(url); toast("✅ تم نسخ رابط المنتج"); }
      catch (e) { window.open("https://wa.me/?text=" + encodeURIComponent(text + "\n" + url), "_blank"); }
    }

    // ===== السلة =====
    let cart = {};
    try { cart = JSON.parse(localStorage.getItem("sofia-cart") || "{}"); } catch (e) {}
    const saveCart = () => { try { localStorage.setItem("sofia-cart", JSON.stringify(cart)); } catch (e) {} };
    function cartList() {
      return Object.entries(cart)
        .map(([id, qty]) => ({ p: byId(id), qty }))
        .filter(x => x.p && !x.p.soldOut && x.qty > 0);
    }
    function updateCart() {
      const items = cartList();
      cart = Object.fromEntries(items.map(x => [x.p.id, x.qty]));
      saveCart();
      const count = items.reduce((s, x) => s + x.qty, 0);
      const total = items.reduce((s, x) => s + x.qty * x.p.price, 0);
      $("cartCount").textContent = count;
      $("cartBtn").hidden = count === 0;
      $("cartTotal").textContent = total;
      $("cartItems").innerHTML = items.length ? items.map(x => `
        <div class="c-item">
          <div class="c-pic">${firstPic(x.p)}</div>
          <div class="c-info"><b>${x.p.name}</b><small>${x.p.price} د.ل</small></div>
          <div class="qty">
            <button data-plus="${x.p.id}">+</button><span>${x.qty}</span><button data-minus="${x.p.id}">−</button>
          </div>
        </div>`).join("") : `<p class="empty">السلة فاضية</p>`;
      const msg = "مرحباً، أبي أطلب من صوفيه:\n" +
        items.map(x => `• ${x.p.name} × ${x.qty} = ${x.qty * x.p.price} د.ل`).join("\n") +
        `\n\nالمجموع: ${total} د.ل`;
      $("sendOrder").href = waLink(msg);
      $("sendOrder").hidden = !items.length;
      $("clearCart").hidden = !items.length;
    }
    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCart();
      toast("✅ أُضيف للسلة");
      track("سلة/" + byId(id).name);
    }
    document.addEventListener("click", e => {
      const add = e.target.closest("[data-add]");
      if (add) { e.stopPropagation(); addToCart(add.dataset.add); }
      const sh = e.target.closest("[data-share]");
      if (sh) share(byId(sh.dataset.share));
      const plus = e.target.closest("[data-plus]");
      if (plus) { cart[plus.dataset.plus]++; updateCart(); }
      const minus = e.target.closest("[data-minus]");
      if (minus) { cart[minus.dataset.minus]--; updateCart(); }
      const close = e.target.closest("[data-close]");
      if (close) close.closest("dialog").close();
      if (e.target.tagName === "DIALOG") e.target.close();
    });
    $("cartBtn").onclick = () => $("cart").showModal();
    $("clearCart").onclick = () => { cart = {}; updateCart(); };
    $("sendOrder").onclick = () => track("طلب-سلة");

    // ===== البحث والترتيب =====
    $("search").oninput = e => { searchText = e.target.value.trim(); showProducts(); };
    $("sort").onchange = e => { sortBy = e.target.value; showProducts(); };

    // ===== البداية =====
    showChips();
    showProducts();
    updateCart();
    const linked = location.hash.startsWith("#p-") && byId(location.hash.slice(3));
    if (linked) openProduct(linked);
  </script>

  <!-- عدّاد الزوار (GoatCounter) -->
  <script data-goatcounter="https://sofia-beauty.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
