<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صوفيه لمستحضرات التجميل</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600&family=Tajawal:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="description" content="صوفيه لتسويق مواد الزينة: مجففات ومصففات الشعر، مكائن الحلاقة وفرش الشعر.">
  <meta property="og:title" content="SOFIA | صوفيه لتسويق مواد الزينة">
  <meta property="og:description" content="تصفّح منتجاتنا وأسعارها واطلب مباشرة على الواتساب.">
  <meta property="og:image" content="https://bdalrhmnbnshbl94-source.github.io/sofia-beauty/og-image.jpg">
    <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:url" content="https://bdalrhmnbnshbl94-source.github.io/sofia-beauty/">
  <meta property="og:type" content="website">
</head>
<body>

  <header>
        <div class="wrap brand"><img src="logo.svg" alt="" class="logo"><b>صوفيه</b><span>لمستحضرات التجميل</span></div>

  </header>

  <main class="wrap">
    <section class="hero">
            <h1><em>صوفيه</em> لتسويق مواد الزينة</h1>
      <p>تصفّح منتجاتنا وأسعارها، واطلب أي منتج مباشرة على الواتساب.</p>
      <div class="contact">واتساب: <b id="phone"></b> <a id="wa" class="wa-btn" target="_blank">راسلنا</a></div>
    </section>

    <!-- البحث والترتيب -->
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="🔍 ابحث عن منتج...">
      <select class="sort" id="sort">
        <option value="new">الترتيب: الأحدث</option>
        <option value="low">السعر: من الأرخص</option>
        <option value="high">السعر: من الأغلى</option>
      </select>
    </div>

    <div class="chips" id="chips"></div>
    <div class="chips sub" id="subchips" hidden></div>
    <section class="grid" id="grid"></section>
  </main>

  <footer>
    <div class="wrap">
      <div class="social" id="social"></div>
      صوفيه لمستحضرات التجميل · الأسعار بالدينار الليبي
    </div>
  </footer>

  <!-- نافذة تفاصيل المنتج -->
  <dialog id="details">
    <button class="close" id="close" aria-label="إغلاق">×</button>
    <div id="detailsBody"></div>
  </dialog>

    <script>document.write('<script src="products.js?v=' + Date.now() + '"><\/script>');</script>
    <script>
    let current = "الكل";      // القسم المختار
    let currentSub = "الكل";   // القسم الفرعي المختار (حلا، مها...)
    let searchText = "";       // نص البحث
    let sortBy = "new";        // طريقة الترتيب

    // ===== رابط واتساب =====
    let waNumber = PHONE.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^0-9]/g, "");
    if (waNumber.startsWith("00")) waNumber = waNumber.slice(2);
    if (waNumber.startsWith("2180")) waNumber = "218" + waNumber.slice(4);
    if (waNumber.startsWith("0")) waNumber = "218" + waNumber.slice(1);
    function waLink(text) {
      return "https://wa.me/" + waNumber + (text ? "?text=" + encodeURIComponent(text) : "");
    }
    function orderLink(p) {
      return waLink("مرحباً، أبي أطلب: " + p.name + " – " + p.price + " د.ل");
    }
    document.getElementById("phone").textContent = PHONE;
    document.getElementById("wa").href = waLink("");

    // ===== روابط انستغرام وتيك توك =====
    let social = "";
    if (INSTAGRAM) social += `<a href="${INSTAGRAM}" target="_blank">انستغرام</a>`;
    if (TIKTOK) social += `<a href="${TIKTOK}" target="_blank">تيك توك</a>`;
    document.getElementById("social").innerHTML = social;

    // ===== صورة المنتج (وإذا ما فيه صورة يظهر أول حرف) =====
    function picture(p) {
      return `<img src="images/${p.image}" alt="${p.name}"
                   onerror="this.outerHTML='<span class=letter>${p.name[0]}</span>'">`;
    }

    // ===== السعر (مع التخفيض إذا موجود) =====
    function priceHTML(p) {
      let html = `<span class="price">${p.price} <small>د.ل</small></span>`;
      if (p.oldPrice > p.price) html += ` <s class="old">${p.oldPrice}</s>`;
      return html;
    }

    // ===== الشارات (جديد / تخفيض / نفدت) =====
    function badges(p) {
      let html = "";
      if (p.soldOut) html += `<span class="badge out">نفدت الكمية</span>`;
      else if (p.oldPrice > p.price) html += `<span class="badge sale">تخفيض</span>`;
      if (p.isNew) html += `<span class="badge new">جديد</span>`;
      return `<div class="badges">${html}</div>`;
    }

    // ===== زر الطلب =====
    function orderButton(p) {
      if (p.soldOut) return `<span class="order disabled">غير متوفر حالياً</span>`;
      return `<a class="order" href="${orderLink(p)}" target="_blank" onclick="event.stopPropagation()">اطلب على واتساب</a>`;
    }

    // ===== أزرار الأقسام والأقسام الفرعية =====
    function showChips() {
      const cats = ["الكل", ...CATEGORIES];
      document.getElementById("chips").innerHTML = cats.map(c =>
        `<button class="chip ${c === current ? "active" : ""}" data-cat="${c}">${c}${SUBCATEGORIES[c] ? " ▾" : ""}</button>`
      ).join("");

      // إذا القسم المختار له أقسام فرعية، تظهر تحته
      const subs = SUBCATEGORIES[current];
      const subBox = document.getElementById("subchips");
      if (subs) {
        subBox.innerHTML = ["الكل", ...subs].map(s =>
          `<button class="chip ${s === currentSub ? "active" : ""}" data-sub="${s}">${s}</button>`
        ).join("");
        subBox.hidden = false;
      } else {
        subBox.innerHTML = "";
        subBox.hidden = true;
      }
    }
    document.getElementById("chips").addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      current = btn.dataset.cat;
      currentSub = "الكل";
      showChips();
      showProducts();
    });
    document.getElementById("subchips").addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      currentSub = btn.dataset.sub;
      showChips();
      showProducts();
    });

    // ===== بطاقات المنتجات =====
    function showProducts() {
      let list = PRODUCTS
        .map((p, i) => ({ ...p, index: i }))
        .filter(p =>
          (current === "الكل" || p.category === current) &&
          (currentSub === "الكل" || p.sub === currentSub) &&
          p.name.includes(searchText)
        );

      if (sortBy === "low") list.sort((a, b) => a.price - b.price);
      if (sortBy === "high") list.sort((a, b) => b.price - a.price);
      if (sortBy === "new") list.reverse(); // آخر منتج تضيفه يظهر أول

      if (list.length === 0) {
        document.getElementById("grid").innerHTML = searchText
          ? `<p class="empty">ما فيه منتج بهذا الاسم 🙁</p>`
          : `<p class="empty">ما فيه منتجات في هذا القسم حالياً، قريباً إن شاء الله ✨</p>`;
        return;
      }

      document.getElementById("grid").innerHTML = list.map(p => `
        <article class="card ${p.soldOut ? "is-out" : ""}" data-index="${p.index}">
          <div class="pic">${picture(p)}${badges(p)}</div>
          <div class="info">
            <div class="cat">${p.sub ? p.category + " · " + p.sub : p.category}</div>
            <h3>${p.name}</h3>
            <div class="prices">${priceHTML(p)}</div>
            ${orderButton(p)}
          </div>
        </article>`
      ).join("");
    }

    // ===== نافذة التفاصيل لما الزبون يضغط على منتج =====
    const dialog = document.getElementById("details");
    document.getElementById("grid").addEventListener("click", e => {
      const card = e.target.closest(".card");
      if (!card) return;
      const p = PRODUCTS[card.dataset.index];
      document.getElementById("detailsBody").innerHTML = `
        <div class="d-pic">${picture(p)}${badges(p)}</div>
        <div class="d-info">
          <div class="cat">${p.sub ? p.category + " · " + p.sub : p.category}</div>
          <h2>${p.name}</h2>
          <p>${p.description || ""}</p>
          <div class="prices">${priceHTML(p)}</div>
          ${orderButton(p)}
        </div>`;
      dialog.showModal();
    });
    document.getElementById("close").onclick = () => dialog.close();
    dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });

    // ===== البحث والترتيب =====
    document.getElementById("search").addEventListener("input", e => {
      searchText = e.target.value.trim();
      showProducts();
    });
    document.getElementById("sort").addEventListener("change", e => {
      sortBy = e.target.value;
      showProducts();
    });

    showChips();
    showProducts();
  </script>
</body>
</html>
